services:
  - type: web
    name: grain-quality-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://your-frontend.vercel.app
      - key: PYTHONUNBUFFERED
        value: "true"
